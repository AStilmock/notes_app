<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<clipPath id="r"><rect width="512" height="512" rx="96"/></clipPath>
<g clip-path="url(#r)">
<defs>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="9" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
    <rect width="8" height="3" y="5" fill="#000" opacity="0.35"/>
  </pattern>
</defs>
<rect width="512" height="512" fill="#020a04"/><rect x="20" y="20" width="472" height="472" rx="80" fill="none" stroke="#22b04f" stroke-width="8"/>
<g filter="url(#glow)" transform="translate(256 256) scale(1) translate(-256 -256)">
  <polyline points="136,160 248,256 136,352" fill="none" stroke="#3dff72" stroke-width="44" stroke-linecap="square" stroke-linejoin="miter"/>
  <rect x="280" y="318" width="112" height="40" fill="#c4ffd4"/>
</g>
<rect width="512" height="512" fill="url(#scan)"/>
</g>
</svg>
